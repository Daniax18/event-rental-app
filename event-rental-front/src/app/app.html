<div class="app-shell" [class.expanded]="expanded()">
  <aside class="sidebar" aria-label="Navigation principale">
    <a routerLink="/" class="brand" aria-label="Mahenintsoa Events — Accueil" title="Mahenintsoa Events">
      <span class="brand-mark">ME</span>
      <span class="brand-name">Mahenintsoa<span>Events</span></span>
    </a>
    <button
      class="sidebar-toggle"
      (click)="expanded.set(!expanded())"
      [attr.aria-expanded]="expanded()"
      [attr.aria-label]="expanded() ? 'Replier le menu' : 'Déplier le menu'"
    >
      <app-icon name="chevron" />
    </button>
    <nav>
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        title="Accueil"
        ><app-icon name="home" /><span>Accueil</span></a
      >
      <div class="nav-divider"></div>
      @for (menu of menus; track menu.path) {
        <a
          [routerLink]="menu.path"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          [title]="menu.title"
          ><app-icon [name]="menu.icon" /><span>{{ menu.title }}</span></a
        >
      }
    </nav>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="breadcrumb">
        <app-icon name="home" /><span>Mon espace</span><span class="breadcrumb-slash">/</span
        ><strong>{{ currentTitle() }}</strong>
      </div>
      <div class="header-actions">
        <div class="popover-wrapper">
          <button
            class="notification-button"
            aria-label="Notifications"
            [attr.aria-expanded]="openPanel() === 'notifications'"
            (click)="togglePanel('notifications')"
          >
            <app-icon name="bell" />
          </button>
          @if (openPanel() === 'notifications') {
            <div class="popover notifications">
              <strong>Notifications</strong>
              <p>Vous êtes à jour.</p>
              <span>Vos prochaines notifications apparaîtront ici.</span>
            </div>
          }
        </div>
        <span class="header-divider"></span>
        <div class="popover-wrapper">
          <button
            class="profile"
            aria-label="Compte administrateur"
            (click)="togglePanel('profile')"
            [attr.aria-expanded]="openPanel() === 'profile'"
          >
            <span class="avatar">AD</span
            ><span class="profile-text"><strong>Admin</strong><small>Administrateur</small></span
            ><app-icon name="chevron" />
          </button>
          @if (openPanel() === 'profile') {
            <div class="popover profile-menu">
              <button class="logout-button" (click)="logout()">Log out</button>
            </div>
          }
        </div>
      </div>
    </header>
    <main id="main-content"><router-outlet /></main>
  </div>
</div>
